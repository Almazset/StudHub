<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Друзья')}"></th:block><link rel="stylesheet" th:href="@{/css/friends.css}"></head>
<body class="app-shell" data-page="friends"><th:block th:replace="~{fragments :: skip}"></th:block><th:block th:replace="~{fragments :: sidebar}"></th:block><div class="drawer-backdrop" data-drawer-close></div><div class="app-main"><th:block th:replace="~{fragments :: topbar('Друзья')}"></th:block><main id="main-content" class="content container-fluid"><div class="friends-page" data-friends-root><header class="friends-heading"><div><p class="eyebrow">STUDHUB COMMUNITY</p><h1>Друзья</h1><p class="muted-copy">Находите друзей и оставайтесь на связи.</p></div></header><p role="alert" class="friends-error" hidden></p><section class="surface friends-search"><h2>Добавить друга</h2><p>Найдите участника по имени, никнейму или ID, например SH-123.</p><form data-friend-search><label class="visually-hidden" for="friendQuery">Имя, никнейм или ID</label><input id="friendQuery" name="query" required minlength="2" maxlength="80" placeholder="Имя, никнейм или SH-ID"><button type="submit" class="btn btn-primary">Найти</button></form><div data-friend-results aria-live="polite"></div></section><nav class="friends-tabs" aria-label="Разделы друзей"><button type="button" data-friend-tab="accepted" aria-pressed="true">Друзья <span data-count="accepted">0</span></button><button type="button" data-friend-tab="incoming" aria-pressed="false">Входящие <span data-count="incoming">0</span></button><button type="button" data-friend-tab="outgoing" aria-pressed="false">Отправленные <span data-count="outgoing">0</span></button></nav><section class="surface friends-list" data-friends-list aria-live="polite"><p>Загрузка…</p></section></div></main><th:block th:replace="~{fragments :: footer}"></th:block></div><th:block th:replace="~{fragments :: toastRegion}"></th:block><th:block th:replace="~{fragments :: scripts}"></th:block><script th:src="@{/js/friends.js}" defer></script></body></html>
