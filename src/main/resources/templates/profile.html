<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head(#{profile.title})}"></th:block></head>
<body class="app-shell" data-page="profile">
<th:block th:replace="~{fragments :: skip}"></th:block><th:block th:replace="~{fragments :: sidebar}"></th:block><div class="drawer-backdrop" data-drawer-close></div>
<div class="app-main"><th:block th:replace="~{fragments :: topbar(#{profile.title})}"></th:block>
<main id="main-content" class="content container-fluid form-page">
  <section class="page-intro"><div><p class="eyebrow" th:text="#{nav.profile}">Профиль</p><h2 th:text="#{profile.title}">Настройки профиля</h2><p class="muted-copy" th:text="#{profile.subtitle}">Личные данные вашей учётной записи.</p></div></section>
  <section class="form-card surface profile-card">
    <header class="form-heading"><span class="user-avatar profile-avatar" th:text="${currentUser.fullName.substring(0,1).toUpperCase()}">А</span><div><p class="eyebrow" th:text="#{app.name}">StudHub</p><h2 th:text="${currentUser.fullName}">Алмаз</h2><p class="muted-copy" th:text="${currentUser.email}">almaz@example.com</p></div></header>
    <form th:object="${profileForm}" th:action="@{/profile}" method="post" data-validate-form data-unsaved-form>
      <div class="field-group"><label for="fullName" th:text="#{common.fullName}">Имя</label><input id="fullName" th:field="*{fullName}" required minlength="2" maxlength="80" autocomplete="name" th:placeholder="#{profile.nameHint}" th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid' : ''" th:aria-invalid="${#fields.hasErrors('fullName')}" th:aria-describedby="${#fields.hasErrors('fullName')} ? 'fullName-error' : 'fullName-hint'"><small id="fullName-error" class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small><small id="fullName-hint" class="field-hint" th:unless="${#fields.hasErrors('fullName')}" th:text="#{profile.nameHint}">Так вас будут видеть в StudHub.</small></div>
      <div class="field-group"><label for="email" th:text="#{common.email}">Электронная почта</label><input id="email" type="email" th:value="${currentUser.email}" readonly aria-readonly="true"><small class="field-hint" th:text="#{profile.emailHint}">Email используется для входа.</small></div>
      <div class="field-group"><label for="role" th:text="#{common.role}">Роль</label><input id="role" th:if="${currentUser.role.name() == 'ADMIN'}" th:value="#{common.admin}" readonly aria-readonly="true"><input id="role" th:unless="${currentUser.role.name() == 'ADMIN'}" th:value="#{common.user}" readonly aria-readonly="true"><small class="field-hint" th:text="#{profile.roleHint}">Роль назначается администратором.</small></div>
      <div class="form-actions"><a class="btn btn-light" th:href="@{/}" th:text="#{action.cancel}">Отмена</a><button class="btn btn-primary" type="submit"><span class="button-label" th:text="#{action.save}">Сохранить</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button></div>
    </form>
  </section>
</main><th:block th:replace="~{fragments :: footer}"></th:block></div><th:block th:replace="~{fragments :: toastRegion}"></th:block><th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
