spring.application.name=StudHub
spring.application.version=0.0.1
spring.profiles.default=dev

server.port=8080
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8
springdoc.swagger-ui.path=/swagger-ui.html
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=14MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
studhub.security.key=${STUDHUB_2FA_KEY:}
studhub.security.key-file=${STUDHUB_2FA_KEY_FILE:.studhub/security.key}
studhub.ai.gemini-api-key=${GEMINI_API_KEY:}
studhub.ai.model=${GEMINI_MODEL:gemini-3.8-flash}

# Keep exception details out of HTTP responses and database errors out of raw logs.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.forward-headers-strategy=none
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
studhub.admin.email=${STUDHUB_ADMIN_EMAIL:}
studhub.admin.password=${STUDHUB_ADMIN_PASSWORD:}
