<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head(#{page.register})}"></th:block><link rel="stylesheet" th:href="@{/css/auth.css}"><script th:src="@{/js/auth-theme.js}"></script></head>
<body class="auth-page auth-refined" data-page="register">
<th:block th:replace="~{fragments :: skip}"></th:block>
<button class="auth-theme-toggle" type="button" data-theme-toggle><i class="bi bi-moon-stars" aria-hidden="true"></i><span>Тёмная тема</span></button>
<main class="auth-layout" id="main-content" tabindex="-1">
  <section class="auth-content"><div class="auth-card"><a class="auth-identity" th:href="@{/login}" aria-label="StudHub"><span class="auth-logo" aria-hidden="true">S<span></span></span><span class="auth-wordmark">StudHub</span></a><h1 th:text="#{auth.registerTitle}">Создать аккаунт</h1><p class="muted-copy" th:text="#{auth.registerSubtitle}">Начните организовывать учёбу в StudHub</p>
    <div class="alert alert-danger auth-alert" role="alert" th:if="${registrationError}" th:text="${registrationError}">Не удалось создать аккаунт.</div>
    <form th:action="@{/register}" th:object="${form}" method="post" data-validate-form data-register-form>
      <div class="field-group"><label for="fullName" th:text="#{common.fullName}">Полное имя</label><div class="auth-input"><i class="bi bi-person" aria-hidden="true"></i><input id="fullName" placeholder="Как к вам обращаться" th:field="*{fullName}" required minlength="2" maxlength="80" autocomplete="name" th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('fullName') ? 'true' : null},aria-describedby=${#fields.hasErrors('fullName') ? 'register-name-error' : null}"></div><small class="field-error" id="register-name-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small></div>
      <div class="field-group"><label for="email" th:text="#{common.email}">Электронная почта</label><div class="auth-input"><i class="bi bi-envelope" aria-hidden="true"></i><input id="email" th:field="*{email}" type="email" required maxlength="120" autocomplete="email" placeholder="name@example.com" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('email') ? 'true' : null},aria-describedby=${#fields.hasErrors('email') ? 'register-email-error' : null}"></div><small class="field-error" id="register-email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small></div>
      <div class="field-group"><label for="password" th:text="#{common.password}">Пароль</label><div class="password-wrap auth-input"><i class="bi bi-lock" aria-hidden="true"></i><input id="password" th:placeholder="#{auth.passwordHint}" th:field="*{password}" type="password" required minlength="8" maxlength="100" autocomplete="new-password" data-password-strength th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('password') ? 'true' : null},aria-describedby=${#fields.hasErrors('password') ? 'register-password-hint register-password-error' : 'register-password-hint'}"><button class="password-toggle" type="button" data-password-toggle="password" aria-controls="password" th:aria-label="#{common.showPassword}" th:title="#{common.showPassword}"><i class="bi bi-eye"></i></button></div><div class="password-strength" data-strength-meter aria-hidden="true"><span></span><span></span><span></span><span></span></div><small class="field-hint" id="register-password-hint" data-strength-text th:text="#{auth.passwordLength}">Минимум 8 символов</small><small class="field-error" id="register-password-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small></div>
      <div class="field-group"><label for="confirmPassword" th:text="#{auth.confirmPassword}">Повторите пароль</label><div class="password-wrap auth-input"><i class="bi bi-lock" aria-hidden="true"></i><input id="confirmPassword" th:placeholder="#{auth.confirmPassword}" name="confirmPassword" type="password" required minlength="8" maxlength="100" autocomplete="new-password" data-confirm-password th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid' : ''" th:attr="aria-invalid=${#fields.hasErrors('confirmPassword') ? 'true' : null},aria-describedby=${#fields.hasErrors('confirmPassword') ? 'register-confirm-message register-confirm-error' : 'register-confirm-message'}"><button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-controls="confirmPassword" th:aria-label="#{common.showPassword}" th:title="#{common.showPassword}"><i class="bi bi-eye"></i></button></div><small class="field-error" id="register-confirm-message" data-confirm-error aria-live="polite"></small><small class="field-error" id="register-confirm-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small></div>
      <button class="btn btn-primary btn-auth" type="submit"><span class="button-label" th:text="#{auth.signUp}">Зарегистрироваться</span></button>
    </form>
    <div class="auth-submit-status" role="status" data-submit-status></div>
    <p class="auth-switch"><span th:text="#{auth.haveAccount}">Уже есть аккаунт?</span> <a th:href="@{/login}" th:text="#{auth.signIn}">Войти</a></p>
  </div></section>
</main><th:block th:replace="~{fragments :: toastRegion}"></th:block><th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
