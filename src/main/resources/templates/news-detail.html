<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Новость')}"></th:block></head>
<body class="app-shell" data-page="news"><th:block th:replace="~{fragments :: skip}"></th:block><th:block th:replace="~{fragments :: sidebar}"></th:block><div class="drawer-backdrop" data-drawer-close></div><div class="app-main"><th:block th:replace="~{fragments :: topbar('Новость')}"></th:block>
<main id="main-content" class="content container-fluid"><a class="text-link" th:href="@{/news}">← Все новости</a><article class="surface news-article"><div class="news-meta"><span class="status-badge" th:text="${post.category.label}"></span><time th:text="${#temporals.format(post.publishedAt,'dd.MM.yyyy HH:mm')}"></time></div><h2 th:text="${post.title}"></h2><p class="news-event" th:if="${post.eventDate != null}">Дата события: <span th:text="${#temporals.format(post.eventDate,'dd.MM.yyyy')}"></span></p><div class="news-body" th:text="${post.body}"></div><a class="btn btn-light" th:if="${post.link != null and !post.link.isBlank()}" th:href="${post.link}" target="_blank" rel="noopener noreferrer">Открыть курс или источник <i class="bi bi-box-arrow-up-right"></i></a>
<div class="news-admin" th:if="${canPublishNews}"><a class="btn btn-light" th:href="@{/news/{id}/edit(id=${post.id})}">Редактировать</a><details><summary>Удалить публикацию</summary><p>Удалить эту новость из общей ленты?</p><form th:action="@{/news/{id}/delete(id=${post.id})}" method="post"><button class="btn btn-danger" type="submit">Да, удалить</button></form></details></div></article></main><th:block th:replace="~{fragments :: footer}"></th:block></div><th:block th:replace="~{fragments :: toastRegion}"></th:block><th:block th:replace="~{fragments :: scripts}"></th:block></body></html>
