spring.application.name=StudHub
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studhub}
spring.datasource.username=${DB_USERNAME:studhub}
spring.datasource.password=${DB_PASSWORD:studhub_pass}
# Local development only; use migrations before deploying to production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
springdoc.swagger-ui.path=/swagger-ui.html
spring.application.version=0.0.1
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=14MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
studhub.security.key=${STUDHUB_2FA_KEY:}
studhub.security.key-file=${STUDHUB_2FA_KEY_FILE:.studhub/security.key}
studhub.ai.gemini-api-key=${GEMINI_API_KEY:}
studhub.ai.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.config.import=optional:file:.studhub/ai.properties

# Never expose exception messages, binding values or stack traces in HTTP errors.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.forward-headers-strategy=none
