<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head('Новости')}"></th:block></head>
<body class="app-shell" data-page="news">
<th:block th:replace="~{fragments :: skip}"></th:block>
<th:block th:replace="~{fragments :: sidebar}"></th:block>
<div class="drawer-backdrop" data-drawer-close></div>
<div class="app-main">
  <th:block th:replace="~{fragments :: topbar('Новости')}"></th:block>
  <main id="main-content" class="content container-fluid">
    <section class="page-intro">
      <div>
        <h2>Новости StudHub</h2>
        <p class="muted-copy">Обновления проекта, новые курсы, анонсы и материалы для учёбы.</p>
      </div>
      <div class="news-actions" th:if="${canPublishNews}">
        <a class="btn btn-light" th:href="@{/news/manage}">Управление публикациями</a>
        <a class="btn btn-primary" th:href="@{/news/new}">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> Написать новость
        </a>
      </div>
    </section>

    <nav class="news-filters" aria-label="Категории новостей">
      <a class="filter-pill" data-news-category="ALL" th:href="@{/news}"
         th:classappend="${selectedCategory == null} ? 'active'"
         th:attr="aria-current=${selectedCategory == null ? 'page' : null}">Все новости</a>
      <a class="filter-pill" th:each="category : ${categories}" th:href="@{/news(category=${category})}"
         th:classappend="${category == selectedCategory} ? 'active'"
         th:attr="data-news-category=${category.name()},aria-current=${category == selectedCategory ? 'page' : null}"
         th:text="${category.label}"></a>
    </nav>

    <div class="surface empty-state" th:if="${newsPage.empty}">
      <span class="empty-illustration"><i class="bi bi-newspaper" aria-hidden="true"></i></span>
      <h3 th:text="${selectedCategory == null ? 'Публикаций пока нет' : 'В этой категории пока нет публикаций'}"></h3>
      <a th:if="${selectedCategory != null}" class="text-link" th:href="@{/news}">Показать все новости</a>
    </div>

    <div class="news-grid" th:unless="${newsPage.empty}">
      <article class="surface news-card" th:each="post : ${newsPage.content}">
        <div th:replace="~{news-parts :: metadata(${post})}"></div>
        <h3><a th:href="@{/news/{id}(id=${post.id})}" th:text="${post.title}"></a></h3>
        <p th:text="${post.excerpt}"></p>
        <p th:replace="~{news-parts :: eventDate(${post})}"></p>
        <div th:replace="~{news-parts :: source(${post})}"></div>
      </article>
    </div>

    <nav class="news-pagination" aria-label="Страницы новостей"
         th:if="${newsPage.hasPrevious() or newsPage.hasNext()}">
      <a class="btn btn-light" th:if="${newsPage.hasPrevious()}"
         th:href="@{/news(page=${newsPage.number - 1},category=${selectedCategory})}" rel="prev">Назад</a>
      <span th:unless="${newsPage.empty}" th:text="|Страница ${newsPage.number + 1} из ${newsPage.totalPages}|"></span>
      <a class="btn btn-light" th:if="${newsPage.hasNext()}"
         th:href="@{/news(page=${newsPage.number + 1},category=${selectedCategory})}" rel="next">Далее</a>
    </nav>
  </main>
  <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
<th:block th:replace="~{fragments :: toastRegion}"></th:block>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
