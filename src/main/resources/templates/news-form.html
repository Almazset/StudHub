<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Публикация')}"></th:block></head>
<body class="app-shell" data-page="news"><th:block th:replace="~{fragments :: skip}"></th:block><th:block th:replace="~{fragments :: sidebar}"></th:block><div class="drawer-backdrop" data-drawer-close></div><div class="app-main"><th:block th:replace="~{fragments :: topbar('Публикация')}"></th:block>
<main id="main-content" class="content container-fluid"><a class="text-link" th:href="@{/news}">← Все новости</a><section class="surface news-article"><h2 th:text="${postId == null ? 'Новая публикация' : 'Редактировать публикацию'}"></h2><p class="muted-copy">После сохранения новость будет видна всем пользователям StudHub.</p><form th:object="${newsForm}" th:action="${postId == null ? '/news' : '/news/' + postId}" method="post">
<div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div>
<div class="field-group"><label for="title">Заголовок</label><input id="title" th:field="*{title}" required maxlength="160" placeholder="Например: открыт курс по Java"></div>
<div class="field-group"><label for="category">Категория</label><select id="category" th:field="*{category}"><option th:each="category : ${categories}" th:value="${category}" th:text="${category.label}"></option></select></div>
<div class="field-group"><label for="body">Текст новости</label><textarea id="body" th:field="*{body}" required maxlength="12000" rows="10" placeholder="Что нового и почему это полезно"></textarea></div>
<div class="field-group"><label for="link">Ссылка на курс или источник (необязательно)</label><input id="link" th:field="*{link}" maxlength="2000" placeholder="https://… или /courses/123"><small class="field-hint">Для внешних новостей укажите первоисточник. Для своего курса скопируйте его адрес.</small></div>
<div class="field-group"><label for="eventDate">Дата события или планируемого обновления (необязательно)</label><input id="eventDate" th:field="*{eventDate}" type="date"><small class="field-hint">Это дата события, а не отложенная публикация: новость появится сразу.</small></div>
<div class="form-actions"><a class="btn btn-light" th:href="@{/news}">Отмена</a><button class="btn btn-primary" type="submit" th:text="${postId == null ? 'Опубликовать' : 'Сохранить изменения'}"></button></div></form></section></main><th:block th:replace="~{fragments :: footer}"></th:block></div><th:block th:replace="~{fragments :: toastRegion}"></th:block><th:block th:replace="~{fragments :: scripts}"></th:block></body></html>
