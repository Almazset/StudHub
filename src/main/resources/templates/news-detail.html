<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head('Новость')}"></th:block></head>
<body class="app-shell" data-page="news">
<th:block th:replace="~{fragments :: skip}"></th:block>
<th:block th:replace="~{fragments :: sidebar}"></th:block>
<div class="drawer-backdrop" data-drawer-close></div>
<div class="app-main">
  <th:block th:replace="~{fragments :: topbar('Новость')}"></th:block>
  <main id="main-content" class="content container-fluid">
    <div class="news-actions">
      <a class="text-link" th:href="@{/news}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Все новости</a>
      <a class="text-link" th:if="${canPublishNews}" th:href="@{/news/manage}">Управление публикациями</a>
    </div>

    <article class="surface news-article">
      <p class="notice-info" th:unless="${post.published}">Черновик виден администраторам StudHub.</p>
      <div th:replace="~{news-parts :: metadata(${post})}"></div>
      <h2 th:text="${post.title}"></h2>
      <p th:replace="~{news-parts :: eventDate(${post})}"></p>
      <div class="news-body" th:text="${post.body}"></div>
      <div th:replace="~{news-parts :: source(${post})}"></div>
      <a class="btn btn-light" th:if="${!post.external and post.safeLink != null}"
         th:href="@{${post.safeLink}}">Открыть курс <i class="bi bi-arrow-right" aria-hidden="true"></i></a>
      <div class="news-admin" th:if="${canPublishNews}">
        <a class="btn btn-light" th:href="@{/news/{id}/edit(id=${post.id})}">Редактировать</a>
      </div>
    </article>
  </main>
  <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
<th:block th:replace="~{fragments :: toastRegion}"></th:block>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
